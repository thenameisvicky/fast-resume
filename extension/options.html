<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>jobwire settings</title>
  <style>
    body { font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif; max-width: 620px; margin: 40px auto; padding: 0 20px; color: #111; }
    h1 { font-size: 19px; margin-bottom: 4px; }
    p.sub { color: #6b7280; margin-top: 0; }
    label { display: block; font-weight: 600; margin: 22px 0 6px; font-size: 13px; }
    input { width: 100%; padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 7px; font: inherit; }
    button { margin-top: 16px; background: #111827; color: #fff; border: 0; border-radius: 7px; padding: 9px 16px; font-weight: 600; cursor: pointer; }
    #msg { margin-top: 14px; font-size: 13px; }
    .ok { color: #15803d; } .bad { color: #b91c1c; }
    .row { margin-top: 10px; font-size: 13px; color: #374151; }
  </style>
</head>
<body>
  <h1>jobwire</h1>
  <p class="sub">Everything runs on this machine. Nothing is sent anywhere else.</p>

  <label for="url">Server address</label>
  <input id="url" placeholder="http://127.0.0.1:7788">
  <div class="row">Start it with <code>npm start</code> in the jobwire folder.</div>

  <button id="save">Save</button>
  <button id="check" style="background:#f3f4f6;color:#111">Test connection</button>
  <div id="msg"></div>

  <script src="options.js"></script>
</body>
</html>
