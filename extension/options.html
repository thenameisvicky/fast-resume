<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>fast-CV settings</title>
  <style>
    body { font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif; max-width: 620px; margin: 40px auto; padding: 0 20px; color: #000; background: #fff; }
    h1 { font-size: 19px; font-weight: 800; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    p.sub { color: #666; margin-top: 0; }
    label { display: block; font-weight: 700; margin: 22px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #666; }
    input { width: 100%; padding: 9px 11px; border: 1px solid #000; border-radius: 0; font: inherit; background: #fff; color: #000; box-sizing: border-box; }
    input:focus { outline: none; }
    button { margin-top: 16px; background: #000; color: #fff; border: 1px solid #000; border-radius: 0; padding: 9px 16px; font-weight: 600; cursor: pointer; text-transform: uppercase; font-size: 11px; transition: all 0.2s; }
    button:hover { background: #fff; color: #000; }
    #msg { margin-top: 14px; font-size: 13px; font-weight: 500; }
    .ok { color: #000; font-weight: bold; } .bad { color: #000; text-decoration: underline; }
    .row { margin-top: 10px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>fast-CV</h1>
  <p class="sub">Everything runs on this machine. Nothing is sent anywhere else.</p>

  <label for="url">Server address</label>
  <input id="url" placeholder="http://127.0.0.1:7788">
  <div class="row">Start it with <code>npm run dev</code> in the fast-CV folder.</div>

  <button id="save">Save</button>
  <button id="check" style="background:#fff;color:#000;margin-left:8px;">Test connection</button>
  <div id="msg"></div>

  <script src="options.js"></script>
</body>
</html>
